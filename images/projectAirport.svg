<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAirport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c16" />
      <stop offset="100%" stop-color="#0b382d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bgAirport)"/>
  <!-- Decorative grid lines -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
  <line x1="50" y1="120" x2="550" y2="120" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
  <line x1="50" y1="190" x2="550" y2="190" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
  <line x1="50" y1="260" x2="550" y2="260" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>
  <!-- Airplane icon in flight -->
  <g transform="translate(180, 80) rotate(-15) scale(1.4)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="url(#accentGrad)"/>
  </g>
  <!-- Flight path dotted -->
  <path d="M 60 220 Q 250 160, 480 90" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- SQL Query terminal badge -->
  <rect x="310" y="160" width="240" height="95" rx="8" fill="#03120e" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <circle cx="328" cy="178" r="4" fill="#ef4444"/>
  <circle cx="342" cy="178" r="4" fill="#f59e0b"/>
  <circle cx="356" cy="178" r="4" fill="#10b981"/>
  <text x="325" y="208" font-family="monospace" font-size="12" fill="#38bdf8">SELECT ad.model, COUNT(*)</text>
  <text x="325" y="226" font-family="monospace" font-size="12" fill="#10b981">FROM flights f JOIN ...</text>
  <text x="325" y="244" font-family="monospace" font-size="11" fill="#94a3b8">WHERE total_amount &gt; 1M</text>
  <!-- Title label -->
  <text x="60" y="90" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#f8fafc">Airport SQL</text>
  <text x="60" y="118" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#10b981">Data Analysis &amp; PostgreSQL</text>
</svg>